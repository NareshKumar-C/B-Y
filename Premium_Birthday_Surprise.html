<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Birthday Surprise</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
height:100vh;overflow:hidden;font-family:Poppins,sans-serif;
background:linear-gradient(135deg,#667eea 0%,#764ba2 25%,#f093fb 50%,#4facfe 75%,#00f2fe 100%);
background-size:400% 400%;
animation:bg 15s ease infinite;
display:flex;justify-content:center;align-items:center;
color:#fff;
}
@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}
.screen{text-align:center}
.hidden{display:none}
.title{font-size:4rem;font-weight:bold}
input{
padding:15px 25px;border:none;border-radius:50px;
margin:20px;font-size:18px;width:320px;text-align:center;
}
button{
width:220px;height:220px;border-radius:50%;
border:none;font-size:24px;font-weight:bold;
cursor:pointer;background:linear-gradient(135deg,#FF6B6B,#FFE66D);
color:white;animation:bounce 2s infinite;
}
@keyframes bounce{
50%{transform:translateY(-15px)}
}
.cake{
font-size:180px;
animation:cakeFloat 3s infinite ease-in-out;
}
@keyframes cakeFloat{
0%,100%{transform:translateY(0) rotate(-3deg)}
50%{transform:translateY(-20px) rotate(3deg)}
}
#countdown{
font-size:120px;
font-weight:bold;
animation:count 1s infinite;
}
@keyframes count{
0%{transform:scale(.2) rotate(-20deg);opacity:0}
50%{transform:scale(1.4) rotate(10deg)}
100%{transform:scale(1)}
}
.birthday-text{
font-size:5rem;
font-weight:900;
background:linear-gradient(90deg,#FF6B6B,#FFE66D,#4ECDC4,#FF69B4);
background-size:300%;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:rainbow 4s infinite;
}
@keyframes rainbow{
50%{background-position:100%}
}
#friendName{font-size:4rem;font-weight:bold}
#gift{font-size:100px;cursor:pointer;animation:bounce 1s infinite}
.float{
position:fixed;
pointer-events:none;
animation:up 6s linear forwards;
}
@keyframes up{
from{transform:translateY(100vh)}
to{transform:translateY(-120vh)}
}
.fire{
position:fixed;
width:8px;height:8px;border-radius:50%;
animation:explode 2s forwards;
}
@keyframes explode{
to{
transform:translate(var(--x),var(--y)) scale(0);
opacity:0;
}
}
.msg{
margin-top:20px;
font-size:1.5rem;
max-width:700px;
padding:20px;
}
</style>
</head>
<body>

<div class="screen" id="welcome">
<h1 class="title">✨ Birthday Surprise ✨</h1>
<p>Let's celebrate someone special!</p>
<input id="name" placeholder="Enter Name">
<br>
<button onclick="startParty()">🎉 LET'S GO 🎉</button>
</div>

<div class="screen hidden" id="cakeScreen">
<div class="cake">🎂</div>
<div id="countdown">5</div>
</div>

<div class="screen hidden" id="birthdayScreen">
<div>🎊</div>
<div class="birthday-text">HAPPY BIRTHDAY</div>
<div id="friendName"></div>
<div id="gift">🎁</div>
<div class="msg" id="message"></div>
</div>

<script>
function startParty(){
let name=document.getElementById("name").value.trim();
if(!name){alert("Enter a name");return;}

window.userName=name;
welcome.classList.add("hidden");
cakeScreen.classList.remove("hidden");

let c=5;
countdown.innerText=c;

let timer=setInterval(()=>{
c--;
if(c>0){
countdown.innerText=c;
fireworks();
}else{
clearInterval(timer);
showBirthday();
}
},1000);
}

function showBirthday(){
cakeScreen.classList.add("hidden");
birthdayScreen.classList.remove("hidden");

typeWriter(userName.toUpperCase(),friendName);

fireworks();

setInterval(hearts,500);
setInterval(stars,300);
setInterval(confetti,250);
}

function typeWriter(text,el){
el.innerHTML="";
let i=0;
let t=setInterval(()=>{
el.innerHTML+=text.charAt(i);
i++;
if(i>=text.length) clearInterval(t);
},120);
}

function hearts(){
let h=document.createElement("div");
h.className="float";
h.innerHTML="💖";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(20+Math.random()*30)+"px";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
}

function stars(){
let h=document.createElement("div");
h.className="float";
h.innerHTML="⭐";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(15+Math.random()*25)+"px";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
}

function confetti(){
let h=document.createElement("div");
h.className="float";
h.innerHTML=["🎉","🎊","✨"][Math.floor(Math.random()*3)];
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
}

function fireworks(){
for(let i=0;i<70;i++){
let f=document.createElement("div");
f.className="fire";
f.style.left=innerWidth/2+"px";
f.style.top=innerHeight/2+"px";
f.style.background=`hsl(${Math.random()*360},100%,50%)`;
let a=Math.random()*6.28;
let d=100+Math.random()*300;
f.style.setProperty("--x",Math.cos(a)*d+"px");
f.style.setProperty("--y",Math.sin(a)*d+"px");
document.body.appendChild(f);
setTimeout(()=>f.remove(),2000);
}
}

gift.onclick=()=>{
gift.innerHTML="💝";
typeWriter(
"May all your dreams come true ✨  May success follow you 🚀  Have a wonderful year ahead ❤️",
message
);
};

document.addEventListener("mousemove",(e)=>{
let s=document.createElement("div");
s.className="float";
s.innerHTML="✨";
s.style.left=e.pageX+"px";
s.style.top=e.pageY+"px";
document.body.appendChild(s);
setTimeout(()=>s.remove(),1000);
});
</script>
</body>
</html>
